name: Flight Watch

on:
  schedule:
    # Tuesdays and Fridays at 13:23 UTC. Times are UTC. Deliberately not on
    # the hour: GitHub delays or drops scheduled runs at busy times like :00.
    - cron: "23 13 * * 2,5"
  workflow_dispatch:
    inputs:
      no_notify:
        description: "Dry run: print deals, don't notify or record them"
        type: boolean
        default: false

permissions:
  contents: write        # to save flight_watch_state.json between runs

concurrency: flight-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (offline, no searches)
        run: python -m unittest
      - name: Search for deals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # optional, for private ntfy servers
          NO_NOTIFY: ${{ inputs.no_notify }}
        run: |
          if [ "$NO_NOTIFY" = "true" ]; then
            python flight_watch.py config.json --no-notify
          else
            python flight_watch.py config.json
          fi
      - name: Save alerted deals
        run: |
          if [ -n "$(git status --porcelain flight_watch_state.json)" ]; then
            git config user.name "flight-watch"
            git config user.email "actions@users.noreply.github.com"
            git add flight_watch_state.json
            git commit -m "Update alerted deals"
            git push
          fi
